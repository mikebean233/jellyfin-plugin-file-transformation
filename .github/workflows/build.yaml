name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Releases from main take the next version number, so they run one at a time
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release' || github.run_id }}

env:
  JELLYFIN_VERSION: 12.4.0
  PROJECT: src/Jellyfin.Plugin.FileTransformation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the next version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          info="$PROJECT/Properties/AssemblyInfo.cs"
          file=$(sed -n 's/.*AssemblyVersion("\([^"]*\)").*/\1/p' "$info")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # a tag pushed by hand: v3.0.3.1 -> 3.0.3.1 (v1.2.3 -> 1.2.3.0)
            tag="$GITHUB_REF_NAME"; v="${tag#v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && v="$v.0"
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            # every push to main is released as the next version: the latest tag with its
            # last number + 1, or AssemblyInfo.cs's version when that's higher
            latest=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -V | tail -1)
            latest=${latest:-0.0.0.0}
            bumped="${latest%.*}.$(( ${latest##*.} + 1 ))"
            v=$(printf '%s\n' "$bumped" "$file" | sort -V | tail -1)
            git rev-parse -q --verify "refs/tags/v$v" >/dev/null && { echo "v$v already exists" >&2; exit 1; }
            tag="v$v"
            release=true
          else
            tag="$GITHUB_REF_NAME"; v="$file"
            release=false
          fi
          # the assembly version comes from AssemblyInfo.cs (GenerateAssemblyInfo is off)
          sed -i "s/AssemblyVersion(\"[^\"]*\")/AssemblyVersion(\"$v\")/" "$info"
          echo "Version $v (tag $tag, release: $release)"
          {
            echo "version=$v"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build "$PROJECT" -c Release -p:JellyfinVersion=$JELLYFIN_VERSION -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        run: |
          zip="dist/file-transformation_${{ steps.version.outputs.version }}_jellyfin-$JELLYFIN_VERSION.zip"
          mkdir -p dist
          zip -j "$zip" "$PROJECT/bin/Release/net10.0/Jellyfin.Plugin.FileTransformation.dll"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Manifest
        # Jellyfin plugin repository file for this release only, so the repository URL
        # .../releases/download/<tag>/manifest.json always offers exactly this version
        run: |
          zip="${{ steps.package.outputs.zip }}"
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}/$(basename "$zip")" \
            --arg md5 "${{ steps.package.outputs.md5 }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            '[{
              guid: "5e87cc92-571a-4d8d-8d98-d2d4147f9f90",
              name: "File Transformation",
              overview: "Lets other plugins change the web client as it is served",
              description: "Fork of IAmParadox27/jellyfin-plugin-file-transformation without HTTP endpoint callbacks.",
              owner: "mikebean233",
              category: "General",
              versions: [{
                version: $version, changelog: ("Release " + $tag), targetAbi: "12.4.0.0",
                sourceUrl: $url, checksum: $md5, timestamp: $ts
              }]
            }]' > dist/manifest.json
          cat dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: file-transformation
          path: dist/*

      - name: Release
        # creates the tag too when it doesn't exist yet (pushes to main)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" dist/manifest.json --target "$GITHUB_SHA" \
            --title "$TAG (Jellyfin $JELLYFIN_VERSION)" --generate-notes \
            --notes "Fork of IAmParadox27/jellyfin-plugin-file-transformation without HTTP endpoint callbacks. Jellyfin repository (this version only): https://github.com/${{ github.repository }}/releases/download/$TAG/manifest.json · md5 ${{ steps.package.outputs.md5 }} · sha256 ${{ steps.package.outputs.sha256 }}"
