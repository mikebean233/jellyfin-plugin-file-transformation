name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JELLYFIN_VERSION: 12.4.0
  PROJECT: src/Jellyfin.Plugin.FileTransformation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          # v3.0.3.1 tag -> 3.0.3.1 (v1.2.3 -> 1.2.3.0); otherwise the version in AssemblyInfo.cs
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && v="$v.0"
            # the assembly version comes from AssemblyInfo.cs (GenerateAssemblyInfo is off)
            sed -i "s/AssemblyVersion(\"[^\"]*\")/AssemblyVersion(\"$v\")/" "$PROJECT/Properties/AssemblyInfo.cs"
          else
            v=$(sed -n 's/.*AssemblyVersion("\([^"]*\)").*/\1/p' "$PROJECT/Properties/AssemblyInfo.cs")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build "$PROJECT" -c Release -p:JellyfinVersion=$JELLYFIN_VERSION -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        run: |
          zip="dist/file-transformation_${{ steps.version.outputs.version }}_jellyfin-$JELLYFIN_VERSION.zip"
          mkdir -p dist
          zip -j "$zip" "$PROJECT/bin/Release/net10.0/Jellyfin.Plugin.FileTransformation.dll"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: file-transformation
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "$GITHUB_REF_NAME (Jellyfin $JELLYFIN_VERSION)" \
            --notes "Fork of IAmParadox27/jellyfin-plugin-file-transformation without HTTP endpoint callbacks. Checksum (md5): ${{ steps.package.outputs.md5 }}"
