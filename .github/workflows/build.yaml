name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JELLYFIN_VERSION: 12.4.0
  PROJECT: src/Jellyfin.Plugin.FileTransformation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          # v3.0.3.1 tag -> 3.0.3.1 (v1.2.3 -> 1.2.3.0); otherwise the version in AssemblyInfo.cs
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && v="$v.0"
            # the assembly version comes from AssemblyInfo.cs (GenerateAssemblyInfo is off)
            sed -i "s/AssemblyVersion(\"[^\"]*\")/AssemblyVersion(\"$v\")/" "$PROJECT/Properties/AssemblyInfo.cs"
          else
            v=$(sed -n 's/.*AssemblyVersion("\([^"]*\)").*/\1/p' "$PROJECT/Properties/AssemblyInfo.cs")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build "$PROJECT" -c Release -p:JellyfinVersion=$JELLYFIN_VERSION -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        run: |
          zip="dist/file-transformation_${{ steps.version.outputs.version }}_jellyfin-$JELLYFIN_VERSION.zip"
          mkdir -p dist
          zip -j "$zip" "$PROJECT/bin/Release/net10.0/Jellyfin.Plugin.FileTransformation.dll"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Manifest
        # Jellyfin plugin repository file for this release only, so the repository URL
        # .../releases/download/<tag>/manifest.json always offers exactly this version
        run: |
          zip="${{ steps.package.outputs.zip }}"
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")" \
            --arg md5 "${{ steps.package.outputs.md5 }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg tag "$GITHUB_REF_NAME" \
            '[{
              guid: "5e87cc92-571a-4d8d-8d98-d2d4147f9f90",
              name: "File Transformation",
              overview: "Lets other plugins change the web client as it is served",
              description: "Fork of IAmParadox27/jellyfin-plugin-file-transformation without HTTP endpoint callbacks.",
              owner: "mikebean233",
              category: "General",
              versions: [{
                version: $version, changelog: ("Release " + $tag), targetAbi: "12.4.0.0",
                sourceUrl: $url, checksum: $md5, timestamp: $ts
              }]
            }]' > dist/manifest.json
          cat dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: file-transformation
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" dist/manifest.json \
            --title "$GITHUB_REF_NAME (Jellyfin $JELLYFIN_VERSION)" \
            --notes "Fork of IAmParadox27/jellyfin-plugin-file-transformation without HTTP endpoint callbacks. Jellyfin repository (this version only): https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/manifest.json · md5 ${{ steps.package.outputs.md5 }} · sha256 ${{ steps.package.outputs.sha256 }}"
